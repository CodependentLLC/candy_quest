<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Candy Quest — Sugar Rush</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="game-shell">
    <section class="titlebar">
      <div>
        <div class="eyebrow">WORLD 1</div>
        <h1>Candy Quest: Sugar Rush</h1>
      </div>
      <button id="restart">Restart</button>
    </section>

    <div class="stage-wrap">
      <canvas id="game" width="1280" height="720" aria-label="Candy Quest platformer"></canvas>
      <section id="hud" class="hud" aria-label="Game status">
        <div class="hud-item"><span class="hud-label">Lives</span><strong id="hud-lives">-</strong></div>
        <div class="hud-item hud-score"><span class="hud-label">Score</span><strong id="hud-score">-</strong></div>
        <div class="hud-item"><span class="hud-label">Candy</span><strong id="hud-candy">-</strong></div>
        <div class="hud-item"><span class="hud-label">Stars</span><strong id="hud-stars">-</strong></div>
        <div class="hud-item"><span class="hud-label">Time</span><strong id="hud-time">-</strong></div>
        <div class="hud-item hud-world"><span class="hud-label">World</span><strong>1-1</strong></div>
      </section>
      <div id="toast" class="toast" aria-live="polite"></div>
    </div>
    <div id="hud-announcement" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <div class="controls" aria-label="Touch controls">
      <div class="move-controls">
        <button data-key="left" aria-label="Move left">←</button>
        <button data-key="right" aria-label="Move right">→</button>
      </div>
      <button data-key="jump" class="jump" aria-label="Jump">JUMP</button>
    </div>

    <p class="hint">A/D or ←/→ to move · Space/W/↑ to jump · R to restart</p>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
