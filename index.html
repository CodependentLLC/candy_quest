<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Candy Quest — Sugar Rush</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="game-shell">
    <section class="titlebar">
      <div>
        <div class="eyebrow" id="world-label">WORLD 1</div>
        <h1>Candy Quest: Sugar Rush</h1>
      </div>
      <div class="title-actions"><button id="open-map" type="button">Map</button><button id="restart">Restart</button></div>
    </section>

    <div class="stage-wrap">
      <canvas id="game" width="1280" height="720" aria-label="Candy Quest platformer"></canvas>
      <section id="hud" class="hud" aria-label="Game status">
        <div class="hud-item"><span class="hud-label">Lives</span><strong id="hud-lives">-</strong></div>
        <div class="hud-item hud-score"><span class="hud-label">Score</span><strong id="hud-score">-</strong></div>
        <div class="hud-item"><span class="hud-label">Candy</span><strong id="hud-candy">-</strong></div>
        <div class="hud-item hud-rush"><span class="hud-label">Sugar Rush</span><progress id="hud-sugar-rush" max="100" value="0">0%</progress></div>
        <div class="hud-item"><span class="hud-label">Stars</span><strong id="hud-stars">-</strong></div>
        <div class="hud-item"><span class="hud-label">Time</span><strong id="hud-time">-</strong></div>
        <div class="hud-item hud-world"><span class="hud-label">Level</span><strong id="hud-world">1-1</strong></div>
      </section>
      <section id="world-map" class="world-map" hidden aria-labelledby="world-map-title"></section>
      <div id="toast" class="toast" aria-live="polite"></div>
      <section id="result-overlay" class="result-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="result-title">
        <h2 id="result-title" data-result-title></h2>
        <p data-result-reason></p>
        <div class="result-stats" aria-label="Final results">
          <span>Score <strong data-result-score>000000</strong></span>
          <span>Candy <strong data-result-candy>0</strong></span>
          <span>Stars <strong data-result-stars>0/3</strong></span>
          <span>Timing <strong data-result-time>Finish Time: 0.0s</strong></span>
        </div>
        <strong data-result-rating class="result-rating"></strong>
        <strong data-result-best class="result-best" hidden>NEW BEST!</strong>
        <button id="result-restart" type="button">Try Again</button>
        <button id="result-map" type="button">Back to Map</button>
      </section>
    </div>
      <div id="hud-announcement" class="sr-only" aria-live="polite" aria-atomic="true"></div>
      <div id="pause-overlay" class="pause-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="pause-title">
        <h2 id="pause-title">Game paused</h2>
        <button id="resume" type="button">Resume</button>
      </div>

    <div class="controls" aria-label="Touch controls">
      <div class="move-controls">
        <button data-key="left" aria-label="Move left">←</button>
        <button data-key="right" aria-label="Move right">→</button>
      </div>
      <button data-key="jump" class="jump" aria-label="Jump">JUMP</button>
      <button data-key="pause" aria-label="Pause or resume game">Pause</button>
    </div>

    <p class="hint">A/D or ←/→ to move · Space/W/↑ to jump · R to restart</p>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
